<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Socket.io 상세 정밀 진단 UI</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { font-family: monospace; padding: 20px; background: #0f172a; color: #f8fafc; }
    h2 { color: #38bdf8; margin-bottom: 5px; }
    p { color: #94a3b8; font-size: 13px; margin-top: 0; }
    .btn-group { margin: 15px 0; }
    button { padding: 10px 18px; margin-right: 8px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; }
    .btn-connect { background-color: #22c55e; color: white; }
    .btn-disconnect { background-color: #ef4444; color: white; }
    #logs { border: 1px solid #334155; padding: 15px; height: 420px; overflow-y: auto; background: #020617; border-radius: 8px; font-size: 13px; line-height: 1.6; }
    .log-item { margin-bottom: 8px; border-bottom: 1px solid #1e293b; padding-bottom: 6px; word-break: break-all; }
    .success { color: #4ade80; font-weight: bold; }
    .error { color: #f87171; font-weight: bold; }
    .warn { color: #fbbf24; }
    .info { color: #38bdf8; }
    .step { color: #c084fc; font-weight: bold; }
  </style>
</head>
<body>
  <h2>🔍 Socket.io 연결 정밀 진단 테스트</h2>
  <p>어디서 연결이 막혔는지 단계별/에러 유형별로 정밀 진단합니다.</p>
  
  <div class="btn-group">
    <button class="btn-connect" onclick="startDiagnostic()">정밀 연결 테스트 시작</button>
    <button class="btn-disconnect" onclick="disconnectSocket()">연결 중단</button>
  </div>

  <h3>진단 로그:</h3>
  <div id="logs"></div>

  <script>
    let socket = null;
    const ALB_URL = "https://zw-korea-alb-1001485199.ap-northeast-2.elb.amazonaws.com";

    function printLog(msg, type = 'info') {
      const logs = document.getElementById('logs');
      const time = new Date().toLocaleTimeString();
      logs.innerHTML += `<div class="log-item ${type}">[${time}] ${msg}</div>`;
      logs.scrollTop = logs.scrollHeight;
    }

    function startDiagnostic() {
      if (socket) socket.disconnect();

      printLog("==========================================", "step");
      printLog("🚀 [1단계] 소켓 진단 프로세스 시작", "step");
      printLog(`타겟 서버 주소: ${ALB_URL}`, "info");

      // file:// 프로토콜 직접 실행 여부 체크
      if (window.location.protocol === 'file:') {
        printLog("⚠️ [경고] 현재 HTML을 local file(file://)로 열었습니다. 브라우저 보안 정책으로 인해 CORS/SSL 에러가 발생할 수 있습니다.", "warn");
      }

      printLog("⏳ [2단계] WebSocket 연결 요청 전송 중...", "info");

      socket = io(ALB_URL, {
        path: "/socket.io",
        transports: ["websocket"], // WebSocket 단독 시도
        withCredentials: true,
        reconnectionAttempts: 1, // 빠른 진단을 위해 재시도 1회로 제한
        timeout: 7000
      });

      // 1. 성공 시
      socket.on("connect", () => {
        printLog("==========================================", "step");
        printLog(`🎉 [최종 성공] 소켓 연결에 성공했습니다!`, "success");
        printLog(`- 발급된 Socket ID: ${socket.id}`, "success");
        printLog(`- 사용 전송 방식: ${socket.io.engine.transport.name}`, "success");
        printLog("백엔드 및 ALB 웹소켓 설정이 모두 정상입니다.", "success");
      });

      // 2. 연결 내부 소켓 에러
      socket.on("connect_error", (err) => {
        printLog("==========================================", "step");
        printLog(`❌ [연결 실패] 상세 에러 진단 결과:`, "error");
        
        const errMsg = err.message || "";
        const errObj = err.description || err;

        printLog(`- RAW 에러 메시지: ${errMsg}`, "warn");

        // 에러 원인별 세부 분석
        if (errMsg.includes("websocket error")) {
          printLog("💡 [원인 분석] 'websocket error' 발생", "error");
          printLog("  ➔ ALB(로드밸런서)에서 WebSocket 프로토콜 업그레이드 요청을 거부했거나 백엔드 3000포트로 전달하지 못하고 있습니다.", "warn");
          printLog("  ➔ 체크포인트 1: ALB 443 리스너 대상그룹(Target Group)의 Stickiness 및 WebSocket 설정 확인", "info");
          printLog("  ➔ 체크포인트 2: EC2 인스턴스 보안그룹(Inbound Rule) 3000 포트 열려있는지 확인", "info");
        } 
        else if (errMsg.includes("xhr poll error") || errMsg.includes("timeout")) {
          printLog("💡 [원인 분석] 'HTTP 타임아웃(504)' 또는 '서버 무응답' 발생", "error");
          printLog("  ➔ 백엔드(Node.js) 프로세스가 죽어있거나 /socket.io 요청에 응답을 주지 못하고 있습니다.", "warn");
          printLog("  ➔ 체크포인트: EC2 터미널에서 'pm2 logs' 실행하여 백엔드 크래시 여부 확인", "info");
        } 
        else if (errMsg.includes("CORS") || errMsg.includes("Not allowed by CORS")) {
          printLog("💡 [원인 분석] 'CORS 차단' 발생", "error");
          printLog("  ➔ 백엔드 .env의 ALLOWED_ORIGINS 설정에 현재 접속 주소가 빠져있습니다.", "warn");
        } 
        else {
          printLog(`💡 [원인 분석] 기타 네트워크/보안 문제 (${errMsg})`, "error");
        }
      });

      // 3. 이벤트 수신 테스트
      socket.on("event:security-alert", (data) => {
        printLog(`📩 [이벤트 수신 성공] event:security-alert: ${JSON.stringify(data)}`, "success");
      });

      // 4. 연결 끊김 발생 시
      socket.on("disconnect", (reason) => {
        printLog(`🔌 [연결 끊김] 사유: ${reason}`, "warn");
      });
    }

    function disconnectSocket() {
      if (socket) {
        socket.disconnect();
        printLog("사용자가 연결을 중단했습니다.", "warn");
      }
    }
  </script>
</body>
</html>
